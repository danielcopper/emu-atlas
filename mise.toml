[tools]
# Runs the tests and the vector harness (pytest). 3.14 is the first interpreter
# with compression.zstd (PEP 784), so a local run takes the side of the squashfs
# reader's codec gate where it is open.
python = "3.14"
uv = "0.10.2"  # creates the venv and installs the package + test deps

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the package (editable) and test deps into the local venv"
run = "uv pip install -e '.[dev]'"

[tasks.test]
description = "Validate the vector shapes, then run the unit tests and the machine-vector runner"
# Shape first: a malformed vector must fail here, not be silently skipped by the runner.
depends = ["validate"]
run = "python -m pytest tests -q"

[tasks.validate]
description = "Check every vector file's shape"
run = "python scripts/validate_vectors.py"

[tasks.complexity]
description = "Report every function whose cognitive complexity is over Sonar's limit (15)"
# The same number Sonar's S3776 reports on the pull request, measured before
# the push so a split is still cheap. The Sonar gate stays as it is. Which
# directories a bare run walks is the script's own default.
run = "python scripts/cognitive_complexity.py"

[tasks.contract]
description = "Regenerate docs/contract-reference.md from this tree and format it"
# Through mise rather than a bare `python` so the page is read off this tree's
# own venv and package: in a worktree a bare `python` can be the main checkout's.
run = "python scripts/generate_contract_reference.py && deno fmt docs/contract-reference.md"

[tasks.matrix]
description = "Regenerate docs/research/coverage-matrix.md from this tree and format it"
# Reads the default es_systems.xml, the RetroDECK Flatpak's bundled one. For
# another file call the script directly with its path (`.venv/bin/python`, then
# the same `deno fmt`): an argument given to this task would be appended to the
# last command, `deno fmt`, not to the script.
run = "python scripts/generate_coverage_matrix.py && deno fmt docs/research/coverage-matrix.md"

[tasks.snapshot-platforms]
description = "Re-record the projection of every single-key platform answer in tests/data/platform_projection.json"
# Renewing is a statement that every key the snapshot test names was meant to
# move, so this runs by hand after reading that list, never as part of a gate.
run = "python scripts/snapshot_platform_projection.py"

[tasks."setup:remote-target"]
description = "Set another machine up as a remote target, or repair it: the dispatcher and the build host's key's one authorized_keys line there, the key and the target's entry in ~/.config/emu-atlas-dev/ here (--print: a script to run on a target this machine cannot log into yet)"
raw = true
usage = '''
arg "<name>" help="The name to give the target: letters, digits, '.', '_' and '-'."
arg "<destination>" help="What your own ssh reaches the target as: user@address, or an alias from your SSH config."
flag "--print" help="Log into nothing: print a script to run on the target, then run the setup again without --print."
'''
# `raw` because a login may ask for a password or about a host key on the
# terminal. The arguments arrive through the usage spec's variables: without
# one, mise appends them to the last line of a multi-line run. `--` so a name
# or destination is never read as an option.
run = '''
exec python scripts/setup_remote_target.py ${usage_print:+--print} -- "$usage_name" "$usage_destination"
'''

[tasks.ask]
description = "Ask atlas one question, here or with --target <name> on a remote target: mise run ask [--target <name>] -- <question>"
# One line and no usage spec: mise appends the arguments to that line, each
# quoted as one word, and leaves a later --target to the question
# (save-portability --target <label>); a usage spec would take it out. The
# script reads its own --target only as the first argument. `raw` so the
# answer reaches stdout untouched, whatever output mode mise is set to.
raw = true
run = "python scripts/ask.py ask"

[tasks.probe]
description = "Run a probe script of scripts/probes/, here or with --target <name> on a remote target: mise run probe [--target <name>] <script> [arguments]"
# As the ask task: one line, no usage spec, raw.
raw = true
run = "python scripts/ask.py probe"

[tasks.test-oldest]
description = "Run the tests on the oldest supported interpreter (the floor `test` does not cover)"
# By hand, not part of `test` or the gate: this one needs its own venv and, the first
# time, an interpreter download. The floor comes from pyproject's requires-python
# (">=X.Y" -> "X.Y") so the number is not repeated here. The venv is a separate
# directory and the interpreter is called by its own path on purpose: .venv is the
# activated one, and a console script inside it pins its interpreter in the shebang, so
# neither PATH nor `mise x python@<floor>` can redirect it. --clear rebuilds that venv on
# every run rather than reusing it: uv installs from its cache in about a second, and a
# gate that inherits leftovers from an earlier run is a gate that can lie.
run = """
floor=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["requires-python"].lstrip(">= "))')
uv venv --clear --python "$floor" .venv-oldest
uv pip install --python .venv-oldest -e '.[dev]'
.venv-oldest/bin/python -V
.venv-oldest/bin/python -m pytest tests -q
"""
