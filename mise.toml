[tools]
python = "3.12"  # runs the tests and the vector harness (pytest)
uv = "0.10.2"    # creates the venv and installs the package + test deps

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the package (editable) and test deps into the local venv"
run = "uv pip install -e '.[dev]'"

[tasks.test]
description = "Validate the vector shapes, then run the unit tests and the machine-vector runner"
# Shape first: a malformed vector must fail here, not be silently skipped by the runner.
depends = ["validate"]
run = "python -m pytest tests -q"

[tasks.validate]
description = "Check every vector file's shape"
run = "python scripts/validate_vectors.py"

[tasks.complexity]
description = "Report every function whose cognitive complexity is over Sonar's limit (15)"
# The same number Sonar's S3776 reports on the pull request, measured before
# the push so a split is still cheap. The Sonar gate stays as it is. Which
# directories a bare run walks is the script's own default.
run = "python scripts/cognitive_complexity.py"

[tasks.test-oldest]
description = "Run the tests on the oldest supported interpreter (the floor `test` does not cover)"
# Pre-push and pre-release, not part of `test`: this one needs its own venv and, the
# first time, an interpreter download. The floor comes from pyproject's requires-python
# (">=3.11" -> "3.11") so the number is not repeated here. The venv is a separate
# directory and the interpreter is called by its own path on purpose: .venv is the
# activated one, and a console script inside it pins its interpreter in the shebang, so
# neither PATH nor `mise x python@<floor>` can redirect it. --clear rebuilds that venv on
# every run rather than reusing it: uv installs from its cache in about a second, and a
# gate that inherits leftovers from an earlier run is a gate that can lie.
run = """
floor=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["requires-python"].lstrip(">= "))')
uv venv --clear --python "$floor" .venv-oldest
uv pip install --python .venv-oldest -e '.[dev]'
.venv-oldest/bin/python -V
.venv-oldest/bin/python -m pytest tests -q
"""
