sonar.projectKey=danielcopper_emu-atlas
sonar.organization=danielcopper

# What gets analysed. The vectors are the normative artifact, not code, and the
# packaged tables under atlas/data/ are data with their own schema validation
# (tests + scripts/validate_vectors.py) — Sonar has nothing useful to say about
# either, so only code is in scope.
sonar.sources=atlas,scripts
sonar.tests=tests
sonar.exclusions=atlas/data/**

# CI runs the suite on 3.11 and 3.12 (pyproject requires-python >= 3.11).
sonar.python.version=3.11, 3.12

# Coverage comes from one pytest run in the sonarcloud CI job.
sonar.python.coverage.reportPaths=coverage.xml

# scripts/ are CI gates, not library code: CI runs validate_vectors.py in the
# `vectors` job and check_vector_breaking_change.py in `breaking-gate` on every
# PR, so they are exercised — just not by pytest. Demanding pytest coverage of
# them would measure the wrong thing. They stay in sonar.sources, so quality and
# security rules still apply.
sonar.coverage.exclusions=scripts/**

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the
# `sonarcloud` CI job itself carries the verdict instead of the SonarCloud app's
# asynchronous commit status. Branch protection then requires a job that always
# reports (see the `sonar-gate` shim in ci.yml), rather than a status that never
# posts on Dependabot PRs.
sonar.qualitygate.wait=true
