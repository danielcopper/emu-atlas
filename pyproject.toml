[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emu-atlas"
version = "0.4.0"
description = "The map of where emulators keep things — a live resolver for emulator installations: saves, firmware, textures, mods, ROMs, systems and platform identities."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
emu-atlas = "atlas.cli:main"

[tool.pytest.ini_options]
# The repo root on sys.path: tests/test_generate_coverage_matrix.py imports
# scripts.*, which is not a package and never installed. Without this a bare
# `pytest tests` fails collection where `python -m pytest tests` succeeds.
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["data/*.json", "py.typed"]
