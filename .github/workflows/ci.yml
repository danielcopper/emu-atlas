name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  breaking-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the breaking-change marker when the vector contract changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_vector_breaking_change.py "origin/$BASE_REF"

  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run the unit tests and the machine-vector runner
        run: |
          pip install -e '.[dev]'
          python -m pytest tests -q
      - name: Type-check (basedpyright)
        run: |
          pip install basedpyright
          basedpyright

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean environment and verify the released contract
        run: |
          EXPECTED=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          cd /tmp && EXPECTED="$EXPECTED" /tmp/clean/bin/python -c "
          import importlib.metadata, importlib.resources, os
          assert importlib.metadata.version('emu-atlas') == os.environ['EXPECTED'], (
              importlib.metadata.version('emu-atlas'), os.environ['EXPECTED'])
          import atlas
          from atlas.firmware import load_hashes
          from atlas.oddities import load_audit, load_oddities
          assert load_oddities() and load_audit() and load_hashes().names()
          assert importlib.resources.files('atlas').joinpath('py.typed').is_file()
          "
      - name: Verify the sdist carries the vectors
        run: tar -tzf dist/*.tar.gz | grep -q "vectors/machines/named-cases.json"

  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SONAR_TOKEN does not reach Dependabot or forked-PR runs, so the scan can
    # only fail there. Skipped rather than failed; `sonar-gate` below is what
    # branch protection requires.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history to attribute new code to the right commits.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Produce Python coverage
        # Run here rather than shipping an artifact between jobs: the whole
        # suite is ~2s, so a second run costs less than the plumbing would.
        run: |
          pip install -e '.[dev]'
          python -m pytest tests --cov=atlas --cov-report=xml -q
      - name: SonarQube Cloud scan
        # The scanner waits on the quality gate (sonar.qualitygate.wait) and
        # exits non-zero when it fails, so this job's own result is the verdict.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Branch-protection shim: `sonarcloud` is skipped on Dependabot and forked
  # PRs, and a skipped required check never reports success — which would
  # deadlock exactly those PRs. This job always reports: it passes when the scan
  # succeeded or was skipped, and fails only when the scan failed. Make THIS the
  # required status check, not `sonarcloud`.
  sonar-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sonarcloud]
    if: always()
    steps:
      - name: Require the scan to pass (skipped on Dependabot / forked PRs)
        env:
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
        run: |
          echo "sonarcloud job result: $SONAR_RESULT"
          if [ "$SONAR_RESULT" = "failure" ] || [ "$SONAR_RESULT" = "cancelled" ]; then
            echo "::error::SonarQube Cloud did not pass"
            exit 1
          fi
