name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  breaking-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the breaking-change marker when the vector contract changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_vector_breaking_change.py "origin/$BASE_REF"

  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run the unit tests and the machine-vector runner
        run: |
          pip install -e '.[dev]'
          python -m pytest tests -q
      - name: Type-check (basedpyright)
        run: |
          pip install basedpyright
          basedpyright

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean environment and verify the released contract
        run: |
          EXPECTED=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          cd /tmp && EXPECTED="$EXPECTED" /tmp/clean/bin/python -c "
          import importlib.metadata, importlib.resources, os
          assert importlib.metadata.version('emu-atlas') == os.environ['EXPECTED'], (
              importlib.metadata.version('emu-atlas'), os.environ['EXPECTED'])
          import atlas
          from atlas.bios import load_registry
          from atlas.oddities import load_audit, load_oddities
          assert load_oddities() and load_audit() and load_registry().platforms()
          assert importlib.resources.files('atlas').joinpath('py.typed').is_file()
          "
      - name: Verify the sdist carries the vectors
        run: tar -tzf dist/*.tar.gz | grep -q "vectors/machines/named-cases.json"
