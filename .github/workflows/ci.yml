name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  breaking-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the breaking-change marker when the vector contract changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_vector_breaking_change.py "origin/$BASE_REF"

  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run the unit tests and the machine-vector runner
        run: |
          pip install -e '.[dev]'
          python -m pytest tests -q
      - name: Type-check (basedpyright)
        run: |
          pip install basedpyright
          basedpyright
