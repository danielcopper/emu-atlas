name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  breaking-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the breaking-change marker when the vector contract changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_vector_breaking_change.py "origin/$BASE_REF"

  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  vectors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is the first interpreter with compression.zstd (PEP 784) — the
        # squashfs reader's codec gate is open there and closed on the others,
        # so the matrix covers both sides of the capability.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate vector file shape
        run: python scripts/validate_vectors.py
      - name: Run the unit tests and the machine-vector runner
        run: |
          pip install -e '.[dev]'
          python -m pytest tests -q
      - name: Type-check (basedpyright)
        # The version comes pinned through the dev extra installed above, so
        # CI and a local `mise run setup` check with the same release — an
        # unpinned install once backtracked to a years-old basedpyright and
        # reported type errors the pinned one does not.
        run: basedpyright

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean environment and verify the released contract
        run: |
          EXPECTED=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          cd /tmp && EXPECTED="$EXPECTED" /tmp/clean/bin/python -c "
          import importlib.metadata, importlib.resources, os
          assert importlib.metadata.version('emu-atlas') == os.environ['EXPECTED'], (
              importlib.metadata.version('emu-atlas'), os.environ['EXPECTED'])
          import atlas
          from atlas.firmware import load_hashes
          from atlas.oddities import load_audit, load_oddities
          assert load_oddities() and load_audit() and load_hashes().names()
          assert importlib.resources.files('atlas').joinpath('py.typed').is_file()
          "
      - name: Verify the sdist carries the vectors
        run: tar -tzf dist/*.tar.gz | grep -q "vectors/machines/named-cases.json"

  # The release attaches a self-contained CLI bundle (pinned CPython 3.14 +
  # the wheel + a launcher; issue #202). Building and smoking it here means
  # the release job is never the first execution of that path: the smoke runs
  # the launcher, proves the zstd capability, checks the import resolves into
  # the bundle, and passes the full suite under the bundle's interpreter.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Assemble the self-contained CLI bundle
        run: python scripts/build_release_bundle.py --tag ci --wheel dist/*.whl --out dist-bundle
      - name: Smoke the built bundle
        run: python scripts/smoke_release_bundle.py dist-bundle/emu-atlas-ci-x86_64-linux.tar.gz

  # A fork's PR only: sonarcloud-fork-pr.yml reads the PR number from this
  # artifact and checks it against the API.
  pr-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Record the PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir pr-metadata
          echo "$PR_NUMBER" > pr-metadata/pr-number

      - name: Upload PR metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-metadata
          path: pr-metadata/

  # A fork's PR only: the coverage sonarcloud-fork-pr.yml hands the scanner,
  # which executes nothing from the fork and so cannot run the suite itself.
  # The same run the `sonarcloud` job makes for its own scan.
  fork-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Produce Python coverage
        run: |
          pip install -e '.[dev]'
          python -m pytest tests --cov=atlas --cov-report=xml -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # Runs on every push to main and every pull request whose head is a branch of
  # this repository, Dependabot's included: a Dependabot PR's run reads
  # SONAR_TOKEN from the repository's Dependabot secrets rather than its Actions
  # secrets, so the token is stored in both. A fork's run gets no secrets, so a
  # fork's PR is skipped here and scanned by sonarcloud-fork-pr.yml once CI has
  # succeeded, using the coverage from `fork-coverage` and the PR number in
  # `pr-metadata`.
  #
  # A failed quality gate blocks the merge through `SonarCloud Code Analysis`,
  # the SonarCloud app's own check, which main's ruleset requires. The app
  # posts it only once an analysis has run — this job's on a branch's PR,
  # sonarcloud-fork-pr.yml's on a fork's — so a scan that never analysed leaves
  # the required check unreported, which blocks as well.
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history to attribute new code to the right commits.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Produce Python coverage
        # Run here rather than shipping coverage from a `vectors` leg: a
        # `needs:` on that matrix would hold this job until every leg has
        # ended, and a leg takes about as long as this run, so the scan would
        # start no sooner and the artifact plumbing would buy nothing.
        run: |
          pip install -e '.[dev]'
          python -m pytest tests --cov=atlas --cov-report=xml -q
      - name: SonarQube Cloud scan
        # The scanner waits on the quality gate (sonar.qualitygate.wait) and
        # exits non-zero when it fails, so this job fails with the gate too,
        # beside the app's check.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
