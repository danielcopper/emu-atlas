name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize releases: two quick pushes to main must not run release-please
# concurrently and race on the release PR / tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mint a GitHub App installation token so release-please's PR/branch
      # pushes are authored by the App, not GITHUB_TOKEN. Pushes made with
      # GITHUB_TOKEN do not trigger workflows (anti-recursion), which would
      # leave the release PR's required status checks stuck "Expected" and
      # unmergeable. Scoped to exactly what release-please needs.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The vectors are the portable contract — publish them as a versioned
      # artifact next to each release, so ports pin a release, not a branch.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Attach the vectors to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          tar -czf "emu-atlas-vectors-$TAG.tar.gz" vectors
          gh release upload "$TAG" "emu-atlas-vectors-$TAG.tar.gz"

      # The self-contained CLI bundle (issue #202) plus the wheel — built from
      # the released commit, smoke-tested before anything is attached. The
      # bundle smoke runs the full suite under the bundle's own interpreter,
      # so what ships is what passed. The build pass also writes SHA256SUMS
      # (issue #329): one line per attached artifact, one per file inside the
      # wheel. Every attached artifact has a named consumer (bundle: no-Python
      # clients; wheel: library installs and vendoring; vectors: ports;
      # SHA256SUMS: file-by-file verification of a vendored directory copy);
      # the sdist has none, so it is built and checked in CI but never
      # attached.
      - uses: actions/setup-python@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          python-version: "3.12"
      - name: Build the wheel
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pip install build
          python -m build --wheel
      - name: Build and smoke the self-contained CLI bundle
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          python scripts/build_release_bundle.py --tag "$TAG" --wheel dist/*.whl --out dist-bundle \
            --artifact "emu-atlas-vectors-$TAG.tar.gz"
          python scripts/smoke_release_bundle.py "dist-bundle/emu-atlas-$TAG-x86_64-linux.tar.gz"
      - name: Attach the bundle, the wheel and the manifest to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: >
          gh release upload "$TAG" "dist-bundle/emu-atlas-$TAG-x86_64-linux.tar.gz"
          dist/*.whl dist-bundle/SHA256SUMS
